name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Discord Audio Stream Bot $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Discord Audio Stream Bot $GITHUB_REF_NAME" \
              --generate-notes
          fi

  portable:
    name: Build ${{ matrix.name }} native app
    needs: create-release
    if: always() && (github.ref_type != 'tag' || needs.create-release.result == 'success')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use preinstalled Java 17 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $javaHome = $env:JAVA_HOME_17_X64
          if (-not $javaHome -or -not (Test-Path $javaHome)) {
            throw "JAVA_HOME_17_X64 is not available on this runner."
          }
          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $javaHome 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Use preinstalled Java 17 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          java_home="${JAVA_HOME_17_X64:-}"
          if [ -z "$java_home" ] || [ ! -d "$java_home" ]; then
            if command -v /usr/libexec/java_home >/dev/null 2>&1; then
              java_home="$(/usr/libexec/java_home -v 17)"
            fi
          fi
          if [ -z "$java_home" ] || [ ! -d "$java_home" ]; then
            echo "::error::JAVA_HOME_17_X64 is not available on this runner."
            exit 1
          fi
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"

      - name: Show tool versions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          java -version
          jpackage --version
          .\gradlew.bat --version

      - name: Show tool versions (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          java -version
          jpackage --version
          ./gradlew --version

      - name: Build native app image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon clean test nativeImageZip

      - name: Build native app image (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew --no-daemon clean test nativeImageZip

      - name: Upload package to release (Windows)
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem -Path build/distributions -Filter '*native-*.zip'
          if ($files.Count -eq 0) {
            throw "No native zip was produced."
          }
          $ghArgs = @('release', 'upload', $env:GITHUB_REF_NAME) + @($files | ForEach-Object { $_.FullName }) + @('--clobber')
          gh @ghArgs

      - name: Upload package to release (Unix)
        if: github.ref_type == 'tag' && runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(build/distributions/*native-*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No native zip was produced."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
