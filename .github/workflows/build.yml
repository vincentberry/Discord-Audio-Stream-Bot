name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compile and test
        run: gradle clean test

      - name: Build portable package
        run: gradle portableZip

      - name: Upload portable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-audio-stream-bot-windows-portable
          path: build/distributions/*portable-windows-*.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Discord Audio Stream Bot ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: build/distributions/*portable-windows-*.zip
