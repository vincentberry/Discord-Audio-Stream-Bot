name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    name: Build ${{ matrix.name }} native app
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact-name: discord-audio-stream-bot-windows-native
          - name: Linux
            os: ubuntu-latest
            artifact-name: discord-audio-stream-bot-linux-native
          - name: macOS
            os: macos-15-intel
            artifact-name: discord-audio-stream-bot-macos-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compile and test
        run: gradle clean test

      - name: Build native app image
        run: gradle nativeImageZip

      - name: Upload native app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build/distributions/*native-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: portable
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Download native apps
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Discord Audio Stream Bot ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: release-assets/*.zip
