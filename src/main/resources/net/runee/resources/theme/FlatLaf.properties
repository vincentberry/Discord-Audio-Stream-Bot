#==============================================================================
# Design 09 - "Rail d'icones" - FlatLaf custom defaults (base: FlatLightLaf)
# Loaded via FlatLaf.registerCustomDefaultsSource("net.runee.resources.theme")
#==============================================================================

#---- base ----
@accentColor = #3A40AC
@background  = #F5F6F8
@foreground  = #1D2230

#---- title bar (sombre) ----
# unifiedBackground=true (defaut FlatLaf) ferait suivre la couleur du contenu clair => on le desactive
TitlePane.unifiedBackground     = false
TitlePane.background            = #23262E
TitlePane.foreground            = #E8EAF0
TitlePane.inactiveBackground    = #23262E
TitlePane.inactiveForeground    = #AEB4C2
TitlePane.borderColor           = #1A1C22
TitlePane.buttonHoverBackground = #FFFFFF22

#---- conteneurs ----
Panel.background      = #F5F6F8
control               = #F5F6F8
Component.borderColor = #D4D8DE
Component.focusColor   = #3A40AC

#---- arrondis ----
Button.arc        = 14
Component.arc     = 12
TextComponent.arc = 12
CheckBox.arc      = 6

#---- texte ----
Label.foreground         = #1D2230
Label.disabledForeground = #98A0AC

#---- listes & champs ----
List.background          = #FFFFFF
List.selectionBackground = #3A40AC
List.selectionForeground = #FFFFFF
TextField.background     = #FFFFFF
TextField.placeholderForeground = #98A0AC

#---- boutons ----
Button.background          = #FBFBFC
Button.borderColor         = #D0D5DC
Button.foreground          = #1D2230
Button.default.background  = #3A40AC
Button.default.foreground  = #FFFFFF
Button.default.borderColor = #3A40AC

#---- titres de groupe ----
TitledBorder.titleColor = #5A6273
