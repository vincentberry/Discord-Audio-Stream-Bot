import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'java'
    id 'application'
    //id 'com.github.johnrengelman.shadow' version '8.1.1' // integrate dependencies into output jar
	id 'com.gradleup.shadow' version '9.1.0'
}

wrapper {
    gradleVersion = '8.14.3'
}

group = 'net.runee'
version = '1.0-SNAPSHOT' // I prefer date based versioning here, leave it at default

def appDisplayName = 'Discord Audio Stream Bot'

application {
    mainClass = 'net.runee.gui.MainFrame'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17 // jda 6 bundles java 17 bytecode
    targetCompatibility = JavaVersion.VERSION_17 // align runtime expectations
}

repositories {
    gradlePluginPortal()
    mavenCentral()
    maven { url = uri('https://m2.dv8tion.net/releases') }
}

dependencies {
	implementation 'net.dv8tion:JDA:6.3.1' // discord api + voice DAVE hooks
    implementation 'moe.kyokobot.libdave:adapter-jda:0.1.2' // JDA DAVE adapter
    implementation 'moe.kyokobot.libdave:impl-jni:0.1.2' // native-backed DAVE implementation
    runtimeOnly 'moe.kyokobot.libdave:natives-win-x86-64:0.1.2'
    runtimeOnly 'moe.kyokobot.libdave:natives-win-x86:0.1.2'
    runtimeOnly 'moe.kyokobot.libdave:natives-win-aarch64:0.1.2'
    runtimeOnly 'moe.kyokobot.libdave:natives-linux-x86-64:0.1.2'
    runtimeOnly 'moe.kyokobot.libdave:natives-linux-x86:0.1.2'
    runtimeOnly 'moe.kyokobot.libdave:natives-linux-aarch64:0.1.2'
    runtimeOnly 'moe.kyokobot.libdave:natives-linux-arm:0.1.2'
    runtimeOnly 'moe.kyokobot.libdave:natives-linux-musl-x86-64:0.1.2'
    runtimeOnly 'moe.kyokobot.libdave:natives-linux-musl-x86:0.1.2'
    runtimeOnly 'moe.kyokobot.libdave:natives-linux-musl-aarch64:0.1.2'
    runtimeOnly 'moe.kyokobot.libdave:natives-linux-musl-arm:0.1.2'
    runtimeOnly 'moe.kyokobot.libdave:natives-darwin:0.1.2'
//    implementation 'com.sedmelluq:lavaplayer:1.3.42' // audio player library for discord
    implementation 'com.jgoodies:jgoodies-forms:1.9.0' // ui framework
    implementation 'com.jgoodies:jgoodies-common:1.8.1' // ui framework
    implementation 'com.jgoodies:jgoodies-looks:2.7.0' // ui framework
    implementation 'com.google.code.gson:gson:2.10.1' // json
//    implementation 'org.apache.commons:commons-lang3:3.12.0' // general utility
//    implementation 'org.slf4j:slf4j-simple:1.7.30' // logging
    implementation 'ch.qos.logback:logback-classic:1.3.6' // logging | 1.3.x uses java 8, 1.4.x uses java 11
    implementation 'org.realityforge.javax.annotation:javax.annotation:1.0.1'
    implementation files('libs/NativeBass.jar') // low-level audio
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // allow special characters in source files
    options.compilerArgs += [
            '-Xlint:unchecked', // show details if not properly using generics
            '-Xlint:deprecation' // show details if using deprecated features
    ]
}
tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// remove version details from output jar
shadowJar {
    archiveBaseName.set(appDisplayName)
    archiveClassifier.set('')
    archiveVersion.set('')
}

def currentOsClassifier = {
    String arch = System.getProperty('os.arch', '').toLowerCase(Locale.ROOT)
    String archClassifier = arch.contains('64') ? 'x64' : 'x86'
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        return "windows-${archClassifier}"
    } else if (Os.isFamily(Os.FAMILY_MAC)) {
        return "mac-${archClassifier}"
    } else if (Os.isFamily(Os.FAMILY_UNIX)) {
        return "linux-${archClassifier}"
    }
    return "unknown-${archClassifier}"
}()

def jlinkExecutable = providers.provider {
    String executableName = Os.isFamily(Os.FAMILY_WINDOWS) ? 'jlink.exe' : 'jlink'
    File javaHome = new File(System.getProperty('java.home'))
    List<File> candidates = [new File(javaHome, "bin/${executableName}")]
    if (javaHome.name.equalsIgnoreCase('jre') && javaHome.parentFile != null) {
        candidates.add(new File(javaHome.parentFile, "bin/${executableName}"))
    }
    File executable = candidates.find { it.isFile() }
    if (executable == null) {
        throw new GradleException("Unable to find ${executableName}. Build the portable package with a JDK, not a JRE.")
    }
    executable.absolutePath
}

def jdkJmodsDir = providers.provider {
    File javaHome = new File(System.getProperty('java.home'))
    List<File> candidates = [new File(javaHome, 'jmods')]
    if (javaHome.name.equalsIgnoreCase('jre') && javaHome.parentFile != null) {
        candidates.add(new File(javaHome.parentFile, 'jmods'))
    }
    File jmods = candidates.find { it.isDirectory() }
    if (jmods == null) {
        throw new GradleException('Unable to find the JDK jmods directory. Build the portable package with a full JDK.')
    }
    jmods.absolutePath
}

def portableRuntimeDir = layout.buildDirectory.dir('portable-runtime')
def portableAppDir = layout.buildDirectory.dir("portable/${appDisplayName}")

tasks.register('portableRuntime', Exec) {
    group = 'distribution'
    description = 'Builds a trimmed Java runtime used by the portable application package.'
    outputs.dir(portableRuntimeDir)
    doFirst {
        delete(portableRuntimeDir.get().asFile)
    }
    executable = jlinkExecutable.get()
    args '--module-path', jdkJmodsDir.get(),
            '--add-modules', 'ALL-MODULE-PATH',
            '--strip-debug',
            '--no-header-files',
            '--no-man-pages',
            '--output', portableRuntimeDir.get().asFile.absolutePath
}

tasks.register('portableDist', Copy) {
    group = 'distribution'
    description = 'Creates a portable app folder with app.jar, BASS natives, launcher scripts, and a bundled Java runtime.'
    dependsOn shadowJar, portableRuntime
    into portableAppDir
    doFirst {
        delete(portableAppDir.get().asFile)
    }
    from(tasks.named('shadowJar').flatMap { it.archiveFile }) {
        rename { 'app.jar' }
    }
    from('natives') {
        into 'natives'
    }
    from(portableRuntimeDir) {
        into 'runtime'
    }
    doLast {
        File outDir = portableAppDir.get().asFile
        File runBat = new File(outDir, 'run.bat')
        runBat.text = '''@echo off
setlocal
cd /d "%~dp0"
set "APP_DIR=%~dp0"
set "JAVA_EXE=%APP_DIR%runtime\\bin\\javaw.exe"
if not exist "%JAVA_EXE%" set "JAVA_EXE=%APP_DIR%runtime\\bin\\java.exe"
set "BASS_NATIVE_DIR=%APP_DIR%natives\\win64"
if /i "%PROCESSOR_ARCHITECTURE%"=="x86" if "%PROCESSOR_ARCHITEW6432%"=="" set "BASS_NATIVE_DIR=%APP_DIR%natives\\win32"
start "" "%JAVA_EXE%" --add-exports=java.desktop/com.sun.java.swing.plaf.windows=ALL-UNNAMED -Djava.library.path="%BASS_NATIVE_DIR%" -jar "%APP_DIR%app.jar" %*
'''
        File runConsoleBat = new File(outDir, 'run-console.bat')
        runConsoleBat.text = '''@echo off
setlocal
cd /d "%~dp0"
set "APP_DIR=%~dp0"
set "JAVA_EXE=%APP_DIR%runtime\\bin\\java.exe"
set "BASS_NATIVE_DIR=%APP_DIR%natives\\win64"
if /i "%PROCESSOR_ARCHITECTURE%"=="x86" if "%PROCESSOR_ARCHITEW6432%"=="" set "BASS_NATIVE_DIR=%APP_DIR%natives\\win32"
"%JAVA_EXE%" --add-exports=java.desktop/com.sun.java.swing.plaf.windows=ALL-UNNAMED -Djava.library.path="%BASS_NATIVE_DIR%" -jar "%APP_DIR%app.jar" %*
pause
'''
        File runSh = new File(outDir, 'run.sh')
        runSh.text = '''#!/usr/bin/env sh
APP_DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
OS_NAME=$(uname -s)
ARCH_NAME=$(uname -m)
NATIVE_SUBDIR=linux64
case "$OS_NAME" in
  Darwin*) NATIVE_SUBDIR=mac ;;
  Linux*)
    case "$ARCH_NAME" in
      i386|i686) NATIVE_SUBDIR=linux32 ;;
      *) NATIVE_SUBDIR=linux64 ;;
    esac
    ;;
esac
exec "$APP_DIR/runtime/bin/java" -Djava.library.path="$APP_DIR/natives/$NATIVE_SUBDIR" -jar "$APP_DIR/app.jar" "$@"
'''
        runSh.setExecutable(true, false)
    }
}

tasks.register('portableZip', Zip) {
    group = 'distribution'
    description = 'Archives the portable app folder for distribution to users without requiring Java to be installed.'
    dependsOn portableDist
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
    archiveFileName.set("${appDisplayName}-portable-${currentOsClassifier}.zip")
    from(portableAppDir) {
        into appDisplayName
    }
}

run {
    // make bass library happy about its natives
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        if (Os.isArch("x86") || Os.isArch("i386") || Os.isArch("i486") || Os.isArch("i586") || Os.isArch("i686")) {
            jvmArgs += '-Djava.library.path=natives/win32/'
        } else if (Os.isArch("x86_64") || Os.isArch("amd64")) {
            jvmArgs += '-Djava.library.path=natives/win64/'
	    } else {
            throw new GradleException('Unrecognized architecture: ' + System.getProperty("os.arch"))
        }
    } else if (Os.isFamily(Os.FAMILY_UNIX)) {
        if (Os.isArch("x86") || Os.isArch("i386") || Os.isArch("i486") || Os.isArch("i586") || Os.isArch("i686")) {
            jvmArgs += '-Djava.library.path=natives/linux32/'
        } else if (Os.isArch("x86_64") || Os.isArch("amd64")) {
            jvmArgs += '-Djava.library.path=natives/linux64/'
        } else {
            throw new GradleException('Unrecognized architecture: ' + System.getProperty("os.arch"))
        }
    } else {
        throw new GradleException('Unrecognized operating system: ' + System.getProperty("os.name"))
    }
    // make java 9's module system happy about jgoodies library
    if (Integer.valueOf(JavaVersion.current().getMajorVersion()) >= 9 && Os.isFamily(Os.FAMILY_WINDOWS)) {
        jvmArgs += '--add-exports=java.desktop/com.sun.java.swing.plaf.windows=ALL-UNNAMED'
    }
}

